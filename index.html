<body>
<div id="app"><div class="splash"><img class="logoimg big" src="icon-192.png" alt=""><b>أي هلب</b><span>خدمات الطريق والمنزل</span></div></div>
<script src="config.js?v=14"></script>
<script src="i18n.js?v=14"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="app.js?v=14"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
// الإشعارات الفورية — OneSignal يسجّل sw.js (الذي يتضمن عامل OneSignal) ويربط المستخدم برقم حسابه
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
  await OneSignal.init({
    appId: "d9816bc6-3a0b-422c-8871-d630e240fc2e",
    safari_web_id: "web.onesignal.auto.1560ab56-4a76-4fcb-b8cd-3f5423fe1d6c",
    serviceWorkerPath: "sw.js",
    serviceWorkerParam: { scope: "/" },
    notifyButton: { enable: false }
  });
});
// احتياط: إن لم يُسجَّل عامل الخدمة خلال ثوانٍ نسجّله نحن للعمل بدون إنترنت
if ("serviceWorker" in navigator) addEventListener("load", () => setTimeout(async () => {
  try { if (!(await navigator.serviceWorker.getRegistration("/"))) navigator.serviceWorker.register("sw.js", { scope: "/" }); } catch (e) {}
}, 6000));
</script>
