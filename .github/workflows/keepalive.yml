# يبقي قاعدة بيانات Supabase المجانية نشطة حتى لا تتوقف بعد ٧ أيام بدون استخدام
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "https://wkopejvbfkdrzgoyqtpw.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_7ZG1sr99za9BeBX77Qp9Cw_nddy8-vm" > /dev/null
          echo "Supabase is awake"
